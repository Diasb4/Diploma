<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="999px" preserveAspectRatio="none" style="width:378px;height:999px;background:#FFFFFF;" version="1.1" viewBox="0 0 378 999" width="378px" zoomAndPan="magnify"><title>MAS: Use Case Overview</title><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="174.0293" x="94.9854" y="23.5625">MAS: Use Case Overview</text><!--cluster Multi-Criteria Assignment System (MAS)--><g id="cluster_Multi-Criteria Assignment System (MAS)"><rect fill="none" height="949" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="255" x="117" y="44.9395"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="239.3613" x="124.8193" y="58.5645">Multi-Criteria Assignment System (MAS)</text></g><g id="elem_LOGIN"><ellipse cx="244.5456" cy="418.0486" fill="#FFFFFF" rx="93.5456" ry="21.1091" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="153.9023" x="167.5944" y="420.4138">Log in with university email</text></g><g id="elem_S1"><ellipse cx="244.6259" cy="102.9646" fill="#FFFFFF" rx="110.6259" ry="24.5252" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="146.2441" x="168.5039" y="98.7674">Maintain academic profile</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="111.0996" x="186.0761" y="113.2869">and thesis proposal</text></g><g id="elem_S2"><ellipse cx="244.2717" cy="186.7938" fill="#FFFFFF" rx="109.7717" ry="24.3543" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="188.8242" x="149.8596" y="189.159">Get supervisor recommendations</text></g><g id="elem_S3"><