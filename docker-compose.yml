name: aitu-diploma

services:
  aitu-superapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitu-diploma-superapp
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - AUTH_SECRET=${AUTH_SECRET:-change-this-secret-before-deploy}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5000}
      - DATA_FILE=/app/data/runtime-state.sqlite
    volumes:
      - aitu-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aitu-data:
