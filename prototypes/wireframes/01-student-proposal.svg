<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Arial, Helvetica, sans-serif">
<title>Wireframe 1: Student proposal editor with recommendations</title>
<desc>Low-fidelity wireframe of the student proposal screen. Fields and limits follow FR-02, the recommendation list follows FR-05 and AC-F05. Sample data for illustration only.</desc>
<rect width="1280" height="900" fill="#ffffff"/>
<g id="top-bar">
<rect x="0" y="0" width="1280" height="56" fill="#f3f3f3"/><line x1="0" y1="56" x2="1280" y2="56" stroke="#c8c8c8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#222" text-anchor="start" >MAS</text>
<text x="120" y="35" font-size="14" font-weight="bold" fill="#222" text-anchor="start" >Proposal</text>
<rect x="120" y="44" width="62" height="3" fill="#222"/>
<text x="220" y="35" font-size="14" font-weight="normal" fill="#666" text-anchor="start" >Supervisors</text>
<text x="330" y="35" font-size="14" font-weight="normal" fill="#666" text-anchor="start" >Preferences</text>
<text x="440" y="35" font-size="14" font-weight="normal" fill="#666" text-anchor="start" >Results</text>
<rect x="1090" y="14" width="96" height="28" rx="14" fill="#fff" stroke="#999" />
<text x="1138" y="33" font-size="13" font-weight="normal" fill="#444" text-anchor="middle" >Student</text>
<circle cx="1226" cy="28" r="14" fill="#ddd" stroke="#999"/>
</g>
<text x="56" y="96" font-size="24" font-weight="bold" fill="#222" text-anchor="start" >Thesis proposal</text>
<text x="56" y="120" font-size="14" font-weight="normal" fill="#666" text-anchor="start" >Describe your topic. MAS compares it with supervisor research profiles.</text>
<text x="1256" y="96" font-size="13" font-weight="normal" fill="#444" text-anchor="end" >Submission deadline: date and time, with time zone</text>
<g id="proposal-form">
<rect x="56" y="140" width="704" height="710" rx="8" fill="#fff" stroke="#bbb" />
<text x="80" y="172" font-size="16" font-weight="bold" fill="#222" text-anchor="start" >Proposal details</text>
<rect x="624" y="154" width="112" height="26" rx="13" fill="#fff" stroke="#999" />
<text x="680" y="172" font-size="12" font-weight="normal" fill="#444" text-anchor="middle" >Status: Draft</text>
<text x="80" y="206" font-size="13" font-weight="bold" fill="#333" text-anchor="start" >Title</text>
<rect x="80" y="214" width="656" height="40" rx="4" fill="#fafafa" stroke="#aaa" />
<text x="94" y="239" font-size="14" font-weight="normal" fill="#999" text-anchor="start" >Working title of your thesis</text>
<text x="80" y="272" font-size="12" font-weight="normal" fill="#888" text-anchor="start" >5 to 200 characters</text>
<text x="736" y="272" font-size="12" font-weight="normal" fill="#888" text-anchor="end" >0 / 200</text>
<text x="80" y="300" font-size="13" font-weight="bold" fill="#333" text-anchor="start" >Abstract</text>
<rect x="80" y="308" width="656" height="200" rx="4" fill="#fafafa" stroke="#aaa" />
<text x="94" y="334" font-size="14" font-weight="normal" fill="#999" text-anchor="start" >Describe the problem, the method you plan to use</text>
<text x="94" y="356" font-size="14" font-weight="normal" fill="#999" text-anchor="start" >and the result you expect.</text>
<text x="80" y="526" font-size="12" font-weight="normal" fill="#888" text-anchor="start" >100 to 5,000 characters</text>
<text x="736" y="526" font-size="12" font-weight="normal" fill="#888" text-anchor="end" >0 / 5,000</text>
<text x="80" y="562" font-size="13" font-weight="bold" fill="#333" text-anchor="start" >Keywords</text>
<rect x="80" y="570" width="656" height="48" rx="4" fill="#fafafa" stroke="#aaa" />
<rect x="92" y="580" width="140" height="28" rx="14" fill="#eee" stroke="#aaa" />
<text x="162.0" y="598.5" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" >computer vision  ×</text>
<rect x="242" y="580" width="76" height="28" rx="14" fill="#eee" stroke="#aaa" />
<text x="280.0" y="598.5" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" >NLP  ×</text>
<rect x="328" y="580" width="128" height="28" rx="14" fill="#eee" stroke="#aaa" />
<text x="392.0" y="598.5" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" >transformers  ×</text>
<text x="474" y="599" font-size="13" font-weight="normal" fill="#999" text-anchor="start" >Add keyword, press Enter</text>
<text x="80" y="636" font-size="12" font-weight="normal" fill="#888" text-anchor="start" >1 to 10 keywords</text>
<text x="736" y="636" font-size="12" font-weight="normal" fill="#888" text-anchor="end" >3 of 10</text>
<rect x="80" y="668" width="130" height="44" rx="6" fill="#fff" stroke="#666" />
<text x="145" y="696" font-size="15" font-weight="normal" fill="#222" text-anchor="middle" >Save draft</text>
<rect x="226" y="668" width="190" height="44" rx="6" fill="#222" stroke="#222" />
<text x="321" y="696" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle" >Submit proposal</text>
<text x="736" y="696" font-size="13" font-weight="normal" fill="#888" text-anchor="end" >Draft saved just now</text>
<rect x="80" y="736" width="656" height="64" rx="6" fill="#fff" stroke="#888" stroke-dasharray="5 4"/>
<text x="96" y="758" font-size="12" font-weight="normal" fill="#666" text-anchor="start" >Example validation message, shown next to the field and linked to it</text>
<text x="96" y="784" font-size="14" font-weight="bold" fill="#222" text-anchor="start" >Abstract: enter at least 100 characters.</text>
</g>
