<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Arial, Helvetica, sans-serif">
<title>Wireframe 3: Coordinator allocation control panel</title>
<desc>Low-fidelity wireframe of the coordinator panel. Readiness checks, ranking policy, run, draft review with validation results, quota usage, publication, CSV export and audit log, as in FR-04 and FR-07 to FR-13. Sample data for illustration only.</desc>
